name: Deploy demo to GitHub Pages

# Builds Rosie with seeded data and publishes a VIEW-ONLY static snapshot to
# GitHub Pages. Runs entirely on GitHub's runners — nothing to run locally.

on:
  push:
    branches: [claude/beautiful-wozniak-s9lf4d]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      DEMO: "1"
      # GitHub Pages serves a project site at /<RepoName>/ (case-sensitive), so
      # the app's basePath must match the repo name exactly.
      PAGES_BASE_PATH: "/${{ github.event.repository.name }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm run db:seed
      - run: npm run build:demo
      - name: Start server and crawl to static
        run: |
          DEMO=1 npx next start -p 4100 &
          for i in $(seq 1 30); do curl -sf http://localhost:4100/rosie/ > /dev/null && break; sleep 2; done
          DEMO_PORT=4100 node scripts/crawl-demo.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
